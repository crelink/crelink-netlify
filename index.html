<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRELINK - Espace Volontaires</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f6; margin: 0; padding: 20px; color: #333; }
        .header { background-color: #28606C; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; border-left: 5px solid #6DCA8D; }
        .card h3 { margin-top: 0; color: #28606C; }
        .badge { background-color: #E8F4F6; color: #28606C; padding: 5px 10px; border-radius: 15px; font-size: 0.85em; margin-right: 5px; display: inline-block; margin-bottom: 10px;}
        .btn { background-color: #28606C; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background-color: #1e4b54; }
        .loader { text-align: center; padding: 20px; font-style: italic; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🤝 Espace Volontaires</h2>
        <p>Besoins actuels de l'école</p>
    </div>

    <div id="demandes-container">
        <div class="loader">Chargement des demandes en cours...</div>
    </div>
</div>

<script>
    // Fonction pour récupérer les données depuis ton API Netlify
    async function chargerDemandes() {
        const container = document.getElementById('demandes-container');
        try {
            // Appel de la fonction invisible getDemandes.js
            const response = await fetch('/.netlify/functions/getDemandes');
            if (!response.ok) throw new Error('Erreur réseau');
            
            const demandes = await response.json();
            container.innerHTML = ''; // Vide le message de chargement

            if (demandes.length === 0) {
                container.innerHTML = '<p style="text-align:center;">🎉 Aucune demande en attente pour le moment.</p>';
                return;
            }

            // Génération des cartes HTML pour chaque ligne récupérée
            demandes.forEach(demande => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>🧩 ${demande.materiel}</h3>
                    <div class="badge">🏫 ${demande.ambiance}</div>
                    <div class="badge">📍 ${demande.aire}</div>
                    <p><strong>🎯 Objet du besoin :</strong> ${demande.impact || 'Non précisé'}</p>
                    <button class="btn" onclick="proposerAide('${demande.id}')">🙋‍♂️ Je me propose</button>
                `;
                container.appendChild(card);
            });

        } catch (error) {
            container.innerHTML = '<p style="color:red; text-align:center;">Erreur lors de la communication avec la base de données.</p>';
            console.error("Erreur:", error);
        }
    }

    // Fonction d'attente pour la soumission (sera développée ensuite)
    function proposerAide(id) {
        alert("Demande " + id + " sélectionnée.\\nL'intégration du code secret sera configurée à l'étape suivante.");
    }

    // Lance le chargement dès l'ouverture de la page
    document.addEventListener('DOMContentLoaded', chargerDemandes);
</script>

</body>
</html>
