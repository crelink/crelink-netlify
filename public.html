<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRELINK - Espace Volontaire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Importation de Poppins (Titres doux) et Inter (Texte lisible) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        teal: '#28606C',
                        dark: '#3F455C',
                        cream: '#F7F5F0',
                        inputBg: '#FFFFFF',
                        borderLight: '#E5E7EB'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream min-h-screen font-sans text-gray-700 pb-20">

    <!-- En-tête -->
    <header class="w-full px-8 py-6 flex justify-between items-center bg-white shadow-sm mb-10">
        <div class="text-teal font-heading font-bold text-xl flex items-center gap-2">
            <span>🪢</span> CRELINK
        </div>
        <button onclick="window.location.href='index.html'" class="text-sm font-medium text-gray-500 hover:text-teal transition-colors">
            Quitter
        </button>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-3xl mx-auto px-6">
        
        <!-- En-tête de section adouci -->
        <div class="mb-10">
            <p class="text-teal text-xs font-bold tracking-widest uppercase mb-3">Inscription</p>
            <h1 class="text-3xl md:text-4xl font-heading font-bold text-dark mb-4 tracking-tight">
                Renseignez votre identité 👤
            </h1>
            <div class="h-1 w-12 bg-teal mb-6 rounded-full opacity-80"></div>
            <p class="text-gray-500 text-sm md:text-base leading-relaxed">
                Avant de poursuivre, indiquez votre prénom et nom. C'est nécessaire pour associer vos compétences aux besoins de l'École Montessori.
            </p>
        </div>

        <!-- Carte Formulaire -->
        <div class="bg-white rounded-3xl p-8 md:p-10 shadow-sm border border-gray-100 mb-8">
            <form id="profilForm">
                
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-5">
                    Mon identité (Pour les interventions)
                </p>
                
                <!-- Inputs Nom / Prénom -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10">
                    <input type="text" placeholder="Prénom" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-5 py-3.5 text-gray-800 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-teal focus:ring-2 focus:ring-teal/20 transition-all font-medium" required>
                    <input type="text" placeholder="Nom" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-5 py-3.5 text-gray-800 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-teal focus:ring-2 focus:ring-teal/20 transition-all font-medium" required>
                </div>

                <!-- Simulation des badges (Pilules) -->
                <div class="mb-10">
                    <p class="text-lg font-heading font-semibold text-dark mb-1 flex items-center gap-2">
                        🏫 Votre profil
                    </p>
                    <p class="text-sm text-gray-500 mb-5">Sélectionnez celui qui vous correspond le mieux.</p>
                    
                    <div class="flex flex-wrap gap-3">
                        <button type="button" class="px-6 py-2.5 rounded-full border-2 border-gray-100 bg-white text-gray-600 text-sm font-medium hover:border-teal hover:text-teal focus:bg-teal focus:text-white focus:border-teal transition-all">Parent d'élève</button>
                        <button type="button" class="px-6 py-2.5 rounded-full border-2 border-gray-100 bg-white text-gray-600 text-sm font-medium hover:border-teal hover:text-teal focus:bg-teal focus:text-white focus:border-teal transition-all">Ancien élève</button>
                        <button type="button" class="px-6 py-2.5 rounded-full border-2 border-gray-100 bg-white text-gray-600 text-sm font-medium hover:border-teal hover:text-teal focus:bg-teal focus:text-white focus:border-teal transition-all">Enseignant</button>
                        <button type="button" class="px-6 py-2.5 rounded-full border-2 border-gray-100 bg-white text-gray-600 text-sm font-medium hover:border-teal hover:text-teal focus:bg-teal focus:text-white focus:border-teal transition-all">Autre</button>
                    </div>
                </div>

                <!-- Bouton de validation -->
                <div class="pt-2">
                    <button type="button" class="w-full md:w-auto bg-dark hover:bg-[#2c3040] text-white font-medium py-3.5 px-8 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2">
                        💾 Enregistrer mon profil
                    </button>
                </div>

            </form>
        </div>

    </main>

</body>
</html>
