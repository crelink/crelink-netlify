<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRELINK - Espace École</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Ajout de Playfair Display pour le titre Serif (comme sur ta maquette) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    },
                    colors: {
                        green: '#6DCA8D',  /* COLOR_GREEN */
                        teal: '#28606C',   /* COLOR_TEAL */
                        dark: '#3F455C',   /* COLOR_DARK */
                        rose: '#F99089',   /* COLOR_ROSE */
                        darker: '#2A2E3D'  /* Une variante encore plus sombre pour le fond de page */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darker min-h-screen font-sans text-white flex flex-col justify-center items-center p-6 relative">

    <!-- Bouton Retour discret -->
    <button onclick="window.location.href='index.html'" class="absolute top-8 left-8 text-sm text-gray-400 hover:text-white transition-colors flex items-center gap-2">
        ← Retour
    </button>

    <!-- Conteneur principal aligné à gauche (max-w-2xl pour contraindre la largeur) -->
    <main class="w-full max-w-2xl">
        
        <!-- En-tête typographique -->
        <div class="mb-10">
            <p class="text-gray-400 text-xs font-bold tracking-widest uppercase mb-4">
                Espace École
            </p>
            <h1 class="text-4xl md:text-5xl font-serif text-white mb-6 flex items-center gap-3">
                Accès réservé <span class="text-3xl">🏫</span>
            </h1>
            <div class="h-1 w-12 bg-green rounded-full"></div>
        </div>

        <!-- Carte de connexion assombrie et translucide -->
        <div class="bg-white/5 border border-white/10 rounded-2xl p-8 md:p-10 shadow-2xl backdrop-blur-sm">
            <p class="text-gray-300 text-sm md:text-base mb-8">
                Accès exclusivement réservé à l'équipe pédagogique. Entrez le mot de passe admin.
            </p>

            <form id="adminLoginForm" class="space-y-6">
                <div>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Mot de passe admin" 
                        class="w-full bg-transparent border border-gray-500 rounded-xl px-5 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-green focus:ring-1 focus:ring-green transition-all"
                        required
                    >
                </div>
                
                <!-- Bouton aligné à gauche et proportionné au texte -->
                <div>
                    <button 
                        type="submit" 
                        class="bg-teal hover:bg-[#1f4a54] text-white font-medium py-3.5 px-8 rounded-xl shadow-lg transition-all flex items-center gap-2"
                    >
                        Accéder →
                    </button>
                </div>
            </form>
            
            <p id="errorMessage" class="text-rose text-sm mt-4 hidden font-medium">Mot de passe incorrect.</p>
        </div>
    </main>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pwd = document.getElementById('password').value;
            // Simulation provisoire de la logique du fichier main.py
            if (pwd === 'admin123') { 
                window.location.href = 'admin_dashboard.html';
            } else {
                document.getElementById('errorMessage').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
